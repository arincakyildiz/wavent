<div class="login">
  <div class="login__panel">
    <div class="login__brand">
      <app-logo-mark class="login__mark" [size]="34" />
      <span class="login__name"><span class="login__name-wav">WAV</span><span class="login__name-ent">ENT</span></span>
    </div>
    <h1>{{ i18n.t('login.title') }}</h1>
    <p class="muted">
      {{ i18n.t('login.subtitle') }}
    </p>

    <div class="login__roles">
      @for (r of roles; track r.value) {
        <button type="button" class="role-card" (click)="loginAs(r.value)">
          <span class="role-card__icon">
            <app-icon [name]="roleIcon(r.value)" [size]="20" />
          </span>
          <span class="role-card__body">
            <span class="role-card__label">{{ i18n.t('role.' + r.value) }}</span>
            <span class="role-card__desc">{{ i18n.t('role.' + r.value + '.desc') }}</span>
            <span class="status-pill tone-neutral">{{ i18n.t('login.permissionCount', { count: permissionCount(r.value) }) }}</span>
          </span>
        </button>
      }
    </div>
  </div>
</div>
