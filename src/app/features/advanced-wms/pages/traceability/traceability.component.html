<div class="page">
  <div class="page__header">
    <div>
      <h1>{{ i18n.t('traceability.title') }}</h1>
      <p class="muted">{{ i18n.t('traceability.subtitle') }}</p>
    </div>
  </div>

  @switch (state()) {
    @case ('loading') {
      <div class="state state--loading">{{ i18n.t('common.loading') }}</div>
    }
    @case ('error') {
      <div class="state state--error">{{ i18n.t('common.loadError') }}</div>
    }
    @case ('success') {
      <div class="toolbar">
        <select [value]="selectedLot()" (change)="selectLot($any($event.target).value)">
          @for (lot of lots(); track lot) {
            <option [value]="lot">{{ lot }}</option>
          }
        </select>
      </div>

      <div class="panel">
        <h2>{{ i18n.t('traceability.timelineFor', { lot: selectedLot() }) }}</h2>
        <app-traceability-timeline [events]="events()" />
      </div>
    }
  }
</div>
