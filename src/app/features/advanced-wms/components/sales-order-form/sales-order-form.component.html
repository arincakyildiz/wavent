<app-form-dialog [title]="i18n.t('orderForm.title')" [subtitle]="i18n.t('orderForm.subtitle')" (dismissed)="dismissed.emit()">
  <form class="form" [formGroup]="form" (ngSubmit)="submit()">
    <div class="form__row"><label class="field"><span class="field__label">{{ i18n.t('common.order') }}</span><input formControlName="number" placeholder="SO-2026001" /></label><label class="field"><span class="field__label">{{ i18n.t('common.warehouse') }}</span><select formControlName="warehouseCode">@for (warehouse of warehouses(); track warehouse.code) { <option [value]="warehouse.code">{{ warehouse.code }} — {{ warehouse.name }}</option> }</select></label><label class="field"><span class="field__label">{{ i18n.t('orderForm.priority') }}</span><input formControlName="priority" type="number" min="1" max="5" /></label></div>
    <div class="form__row"><label class="field"><span class="field__label">{{ i18n.t('common.product') }}</span><select formControlName="skuCode">@for (sku of options.skus; track sku.code) { <option [value]="sku.code">{{ sku.code }} — {{ sku.name }}</option> }</select></label><label class="field"><span class="field__label">{{ i18n.t('common.quantity') }}</span><input formControlName="quantity" type="number" min="1" max="1000000" step="1" /></label></div>
    <div class="form__row"><label class="field"><span class="field__label">{{ i18n.t('common.carrier') }}</span><select formControlName="carrier">@for (carrier of options.carriers; track carrier) { <option [value]="carrier">{{ carrier }}</option> }</select></label><label class="field"><span class="field__label">{{ i18n.t('orderForm.route') }}</span><input formControlName="route" /></label><label class="field"><span class="field__label">{{ i18n.t('orderForm.cutoff') }}</span><input formControlName="cutOffTime" type="time" /></label></div>
    @if (submitError()) { <div class="form__error" role="alert">{{ submitError() }}</div> }
    <div class="form__actions"><button class="btn" type="button" (click)="dismissed.emit()">{{ i18n.t('common.cancel') }}</button><button class="btn btn--primary" type="submit" [disabled]="submitting() || form.invalid">{{ submitting() ? i18n.t('common.saving') : i18n.t('orderForm.submit') }}</button></div>
  </form>
</app-form-dialog>
