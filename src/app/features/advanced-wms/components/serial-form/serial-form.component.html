<app-form-dialog
  [title]="i18n.t('serial.title')"
  [subtitle]="i18n.t('serial.subtitle')"
  (dismissed)="dismissed.emit()"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="form">
    <div class="form__row">
      <label class="field">
        <span class="field__label">{{ i18n.t('common.product') }} <span class="req">*</span></span>
        <select
          formControlName="skuCode"
          (change)="onSku($any($event.target).value)"
          [class.invalid]="invalid('skuCode')"
        >
          @for (s of skus; track s.code) {
            <option [value]="s.code">{{ s.code }} — {{ s.name }}</option>
          }
        </select>
        <span class="field__hint">{{ i18n.t('serial.onlySerialTracked') }}</span>
      </label>

      <label class="field">
        <span class="field__label">{{ i18n.t('serial.number') }} <span class="req">*</span></span>
        <input
          formControlName="serial"
          type="text"
          placeholder="SN-88999"
          autocomplete="off"
          maxlength="40"
          [class.invalid]="invalid('serial')"
          [attr.aria-invalid]="invalid('serial')"
        />
        @if (serialControl.pending) {
          <span class="field__hint">{{ i18n.t('serial.checking') }}</span>
        } @else if (invalid('serial')) {
          <span class="field__error" role="alert">
            @if (serialControl.hasError('required')) {
              {{ i18n.t('serial.required') }}
            } @else if (serialControl.hasError('serialPattern')) {
              {{ i18n.t('serial.format') }}
            } @else if (serialControl.hasError('maxlength')) {
              {{ i18n.t('serial.maxLength') }}
            } @else if (serialControl.hasError('notUnique')) {
              {{ i18n.t('serial.taken') }}
            }
          </span>
        } @else {
          <span class="field__hint">
            {{ i18n.t('serial.hint') }}
            {{ serialControl.value.length }}/40
          </span>
        }
      </label>
    </div>

    <div class="form__row">
      <label class="field">
        <span class="field__label">{{ i18n.t('common.warehouse') }} <span class="req">*</span></span>
        <select
          formControlName="warehouseCode"
          (change)="onWarehouse($any($event.target).value)"
          [class.invalid]="invalid('warehouseCode')"
        >
          @for (w of warehouses(); track w.code) {
            <option [value]="w.code">{{ w.code }} — {{ w.name }}</option>
          }
        </select>
      </label>

      <label class="field">
        <span class="field__label">{{ i18n.t('common.location') }} <span class="req">*</span></span>
        <select formControlName="locationPath" [class.invalid]="invalid('locationPath')">
          @if (!locationPaths().length) {
            <option value="">{{ i18n.t('serial.locationLoading') }}</option>
          }
          @for (path of locationPaths(); track path) {
            <option [value]="path">{{ path }}</option>
          }
        </select>
        @if (invalid('locationPath')) {
          <span class="field__error" role="alert">{{ i18n.t('serial.locationRequired') }}</span>
        }
      </label>
    </div>

    <div class="form__row">
      <label class="field">
        <span class="field__label">{{ i18n.t('serial.lotOptional') }}</span>
        <input
          formControlName="lot"
          type="text"
          placeholder="L-24100"
          autocomplete="off"
          maxlength="20"
        />
        <span class="field__hint">{{ i18n.t('serial.lotHint') }}</span>
      </label>
    </div>

    @if (submitError()) {
      <div class="form__error" role="alert">{{ submitError() }}</div>
    }

    <div class="form__actions">
      <button type="button" class="btn" (click)="dismissed.emit()" [disabled]="submitting()">
        {{ i18n.t('common.cancel') }}
      </button>
      <button type="submit" class="btn btn--primary" [disabled]="submitting() || form.pending">
        {{ submitting() ? 'Kaydediliyor...' : 'Seriyi kaydet' }}
      </button>
    </div>
  </form>
</app-form-dialog>
