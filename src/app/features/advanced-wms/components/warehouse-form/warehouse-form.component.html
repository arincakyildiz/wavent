<app-form-dialog
  title="Yeni Depo"
  [subtitle]="i18n.t('warehouseForm.subtitle')"
  (dismissed)="dismissed.emit()"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="form">
    <div class="form__row">
      <label class="field">
        <span class="field__label">Depo Kodu <span class="req">*</span></span>
        <input
          formControlName="code"
          type="text"
          placeholder="IST-02"
          autocomplete="off"
          maxlength="7"
          [class.invalid]="invalid('code')"
          [attr.aria-invalid]="invalid('code')"
        />
        @if (codeControl.pending) {
          <span class="field__hint">Kod kontrol ediliyor...</span>
        } @else if (invalid('code')) {
          <span class="field__error" role="alert">
            @if (codeControl.hasError('required')) {
              {{ i18n.t('warehouseForm.codeRequired') }}
            } @else if (codeControl.hasError('codePattern')) {
              {{ i18n.t('warehouseForm.codeFormat') }}
            } @else if (codeControl.hasError('notUnique')) {
              {{ i18n.t('warehouseForm.codeTaken') }}
            }
          </span>
        } @else {
          <span class="field__hint">
            {{ i18n.t('warehouseForm.codeHint', { max: limits.codeMax }) }}
          </span>
        }
      </label>

      <label class="field">
        <span class="field__label">{{ i18n.t('warehouseForm.name') }} <span class="req">*</span></span>
        <input
          formControlName="name"
          type="text"
          placeholder="Istanbul Anadolu DC"
          maxlength="60"
          [class.invalid]="invalid('name')"
        />
        @if (invalid('name')) {
          <span class="field__error" role="alert">
            @if (form.controls.name.hasError('maxlength')) {
              En fazla {{ limits.nameMax }} karakter girebilirsiniz.
            } @else {
              En az {{ limits.nameMin }} karakterlik bir ad girin.
            }
          </span>
        } @else {
          <span class="field__hint">
            {{ limits.nameMin }}–{{ limits.nameMax }} karakter.
            {{ form.controls.name.value.length }}/{{ limits.nameMax }}
          </span>
        }
      </label>
    </div>

    <div class="form__row">
      <label class="field">
        <span class="field__label">{{ i18n.t('warehouseForm.city') }} <span class="req">*</span></span>
        <input formControlName="city" type="text" maxlength="40" [class.invalid]="invalid('city')" />
        @if (invalid('city')) {
          <span class="field__error" role="alert">
            @if (form.controls.city.hasError('maxlength')) {
              En fazla {{ limits.cityMax }} karakter girebilirsiniz.
            } @else {
              {{ i18n.t('warehouseForm.cityRequired') }}
            }
          </span>
        } @else {
          <span class="field__hint">En fazla {{ limits.cityMax }} karakter.</span>
        }
      </label>

      <label class="field">
        <span class="field__label">{{ i18n.t('warehouseForm.country') }} <span class="req">*</span></span>
        <input formControlName="country" type="text" maxlength="40" [class.invalid]="invalid('country')" />
        @if (invalid('country')) {
          <span class="field__error" role="alert">
            @if (form.controls.country.hasError('maxlength')) {
              En fazla {{ limits.countryMax }} karakter girebilirsiniz.
            } @else {
              {{ i18n.t('warehouseForm.countryRequired') }}
            }
          </span>
        } @else {
          <span class="field__hint">En fazla {{ limits.countryMax }} karakter.</span>
        }
      </label>
    </div>

    <div class="form__row">
      <label class="field">
        <span class="field__label">Saat Dilimi</span>
        <select formControlName="timezone">
          @for (tz of timezones; track tz) {
            <option [value]="tz">{{ tz }}</option>
          }
        </select>
      </label>

      <label class="field">
        <span class="field__label">{{ i18n.t('warehouseForm.open') }} <span class="req">*</span></span>
        <input formControlName="open" type="time" [class.invalid]="invalid('open')" />
      </label>

      <label class="field">
        <span class="field__label">{{ i18n.t('warehouseForm.close') }} <span class="req">*</span></span>
        <input formControlName="close" type="time" [class.invalid]="invalid('close')" />
        @if (invalid('close') && form.controls.close.hasError('hoursRange')) {
          <span class="field__error" role="alert">{{ i18n.t('warehouseForm.closeAfterOpen') }}</span>
        }
      </label>
    </div>

    @if (submitError()) {
      <div class="form__error" role="alert">{{ submitError() }}</div>
    }

    <div class="form__actions">
      <button class="btn" type="button" (click)="dismissed.emit()">{{ i18n.t('common.cancel') }}</button>
      <button class="btn btn--primary" type="submit" [disabled]="submitting() || form.pending">
        {{ submitting() ? i18n.t('common.saving') : i18n.t('warehouseForm.submit') }}
      </button>
    </div>
  </form>
</app-form-dialog>
