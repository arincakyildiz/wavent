<app-form-dialog
  [title]="i18n.t('waveForm.title')"
  [subtitle]="i18n.t('waveForm.subtitle')"
  (dismissed)="dismissed.emit()"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="form">
    <div class="form__row">
      <label class="field">
        <span class="field__label">{{ i18n.t('waveForm.name') }} <span class="req">*</span></span>
        <input
          formControlName="name"
          type="text"
          [attr.placeholder]="i18n.t('waveForm.nameExample')"
          autocomplete="off"
          [attr.maxlength]="limits.nameMax"
          [class.invalid]="invalid('name')"
          [attr.aria-invalid]="invalid('name')"
        />
        @if (nameControl.pending) {
          <span class="field__hint">{{ i18n.t('waveForm.checking') }}</span>
        } @else if (invalid('name')) {
          <span class="field__error" role="alert">
            @if (nameControl.hasError('notUnique')) {
              {{ i18n.t('waveForm.nameTaken') }}
            } @else if (nameControl.hasError('maxlength')) {
              {{ i18n.t('form.maxChars', { max: limits.nameMax }) }}
            } @else {
              {{ i18n.t('form.minCharsName', { min: limits.nameMin }) }}
            }
          </span>
        } @else {
          <span class="field__hint">
            {{ i18n.t('form.charRange', { min: limits.nameMin, max: limits.nameMax }) }}
            {{ nameControl.value.length }}/{{ limits.nameMax }}
          </span>
        }
      </label>

      <label class="field">
        <span class="field__label">{{ i18n.t('common.warehouse') }} <span class="req">*</span></span>
        <select formControlName="warehouseCode">
          @for (w of warehouses(); track w.code) {
            <option [value]="w.code">{{ w.code }} — {{ w.name }}</option>
          }
        </select>
      </label>
    </div>

    <div class="form__row">
      <label class="field">
        <span class="field__label">{{ i18n.t('waveForm.zone') }}</span>
        <select formControlName="zone">
          @for (z of zones; track z) {
            <option [value]="z">{{ z || i18n.t('common.all') }}</option>
          }
        </select>
      </label>

      <label class="field">
        <span class="field__label">{{ i18n.t('waveForm.carrier') }} <span class="req">*</span></span>
        <select formControlName="carrier">
          @for (c of carriers; track c) {
            <option [value]="c">{{ c }}</option>
          }
        </select>
      </label>

      <label class="field">
        <span class="field__label">{{ i18n.t('waveForm.cutOff') }} <span class="req">*</span></span>
        <input formControlName="cutOffTime" type="time" [class.invalid]="invalid('cutOffTime')" />
        @if (form.controls.cutOffTime.hasError('cutOffRunway')) {
          <span class="field__error" role="alert">
            {{ i18n.t('waveForm.runway', { min: minRunway }) }}
          </span>
        }
      </label>
    </div>

    <div class="form__row">
      <label class="field">
        <span class="field__label">{{ i18n.t('waveForm.minPriority') }} <span class="req">*</span></span>
        <input
          formControlName="minPriority"
          type="number"
          [min]="limits.priorityMin"
          [max]="limits.priorityMax"
          [class.invalid]="invalid('minPriority')"
          [attr.aria-invalid]="invalid('minPriority')"
        />
        @if (invalid('minPriority')) {
          <span class="field__error" role="alert">
            {{ i18n.t('waveForm.priorityRange', { min: limits.priorityMin, max: limits.priorityMax }) }}
          </span>
        } @else {
          <span class="field__hint">
            {{ i18n.t('waveForm.priorityHint', { min: limits.priorityMin, max: limits.priorityMax }) }}
          </span>
        }
      </label>

      <label class="field">
        <span class="field__label">{{ i18n.t('waveForm.maxOrders') }} <span class="req">*</span></span>
        <input
          formControlName="maxOrders"
          type="number"
          [min]="limits.ordersMin"
          [max]="limits.ordersMax"
          [class.invalid]="invalid('maxOrders')"
          [attr.aria-invalid]="invalid('maxOrders')"
        />
        @if (invalid('maxOrders')) {
          <span class="field__error" role="alert">
            {{ i18n.t('waveForm.ordersMaxError', { max: limits.ordersMax }) }}
            {{ i18n.t('form.atLeast', { min: limits.ordersMin }) }}
          </span>
        } @else {
          <span class="field__hint">
            {{ i18n.t('waveForm.ordersHint', { min: limits.ordersMin, max: limits.ordersMax }) }}
          </span>
        }
      </label>
    </div>

    @if (submitError()) {
      <div class="form__error" role="alert">{{ submitError() }}</div>
    }

    <div class="form__actions">
      <button class="btn" type="button" (click)="dismissed.emit()">{{ i18n.t('common.cancel') }}</button>
      <button class="btn btn--primary" type="submit" [disabled]="submitting() || form.pending">
        {{ submitting() ? i18n.t('waveForm.creating') : i18n.t('waveForm.submit') }}
      </button>
    </div>
  </form>
</app-form-dialog>
