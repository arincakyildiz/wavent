@if (dialog(); as d) {
  <div class="backdrop" (keydown)="onBackdropKeydown($event)" tabindex="-1">
    <div
      class="dialog"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="'confirm-title-' + d.id"
      [attr.aria-describedby]="'confirm-msg-' + d.id"
    >
      <h2 class="dialog__title" [id]="'confirm-title-' + d.id">{{ d.title }}</h2>
      <p class="dialog__message" [id]="'confirm-msg-' + d.id">{{ d.message }}</p>

      <form [formGroup]="form" (ngSubmit)="confirm()">
        @if (d.requireReason) {
          <label class="dialog__field">
            <span class="dialog__label">{{ d.reasonLabel ?? i18n.t('common.reason') }} <span class="req">*</span></span>
            <textarea
              #reasonInput
              formControlName="reason"
              rows="3"
              maxlength="300"
              [attr.placeholder]="d.reasonPlaceholder ?? i18n.t('confirm.reasonPlaceholder')"
              [attr.aria-invalid]="reasonInvalid"
              [class.invalid]="reasonInvalid"
            ></textarea>
            <span class="dialog__hint">{{ form.controls.reason.value.length }}/300</span>
            @if (reasonInvalid) {
              <span class="dialog__error" role="alert">
                @if (form.controls.reason.hasError('required')) {
                  {{ i18n.t('confirm.reasonRequiredShort', { label: d.reasonLabel ?? i18n.t('common.reason') }) }}
                } @else if (form.controls.reason.hasError('minlength')) {
                  {{ i18n.t('confirm.reasonMin', { label: d.reasonLabel ?? i18n.t('common.reason'), min: 6 }) }}
                } @else {
                  {{ i18n.t('confirm.reasonMaxLength', { label: d.reasonLabel ?? i18n.t('common.reason'), max: 300 }) }}
                }
              </span>
            }
          </label>
        }

        <div class="dialog__actions">
          <button class="btn" type="button" (click)="cancel()">{{ d.cancelLabel ?? i18n.t('common.cancel') }}</button>
          <button
            #confirmBtn
            class="btn btn--primary"
            [class.btn--danger]="d.tone === 'danger'"
            type="submit"
          >
            {{ d.confirmLabel ?? 'Onayla' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
