@if (events().length) {
  <ol class="timeline">
    @for (e of events(); track e.id) {
      <li class="timeline__item">
        <span class="status-pill" [class]="stageTone(e.stage)">{{ e.stage }}</span>
        <div class="timeline__body">
          <div class="timeline__desc">{{ e.description }}</div>
          <div class="muted small">{{ e.at }} · {{ e.referenceId }} · {{ e.actor }}</div>
        </div>
      </li>
    }
  </ol>
} @else {
  <div class="state state--empty">{{ emptyMessage() }}</div>
}
